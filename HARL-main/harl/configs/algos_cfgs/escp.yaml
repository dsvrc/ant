# Configuration file for ESCP (HAPPO + Environment-Sensitive Contextual Policy).
seed:
  seed_specify: True
  seed: 1
device:
  cuda: True
  cuda_deterministic: True
  torch_threads: 4
train:
  n_rollout_threads: 20
  num_env_steps: 10000000
  episode_length: 200
  log_interval: 5
  eval_interval: 25
  use_valuenorm: True
  use_linear_lr_decay: False
  use_proper_time_limits: True
  model_dir: ~
eval:
  use_eval: True
  n_eval_rollout_threads: 10
  eval_episodes: 20
render:
  use_render: False
  render_episodes: 10
model:
  hidden_sizes: [128, 128]
  activation_func: relu
  use_feature_normalization: True
  initialization_method: orthogonal_
  gain: 0.01
  use_naive_recurrent_policy: False
  use_recurrent_policy: False
  recurrent_n: 1
  data_chunk_length: 10
  lr: 0.0005
  critic_lr: 0.0005
  opti_eps: 0.00001
  weight_decay: 0
  std_x_coef: 1
  std_y_coef: 0.5
algo:
  ppo_epoch: 5
  critic_epoch: 5
  use_clipped_value_loss: True
  clip_param: 0.2
  actor_num_mini_batch: 1
  critic_num_mini_batch: 1
  entropy_coef: 0.01
  value_loss_coef: 1
  use_max_grad_norm: True
  max_grad_norm: 10.0
  use_gae: True
  gamma: 0.99
  gae_lambda: 0.95
  use_huber_loss: True
  use_policy_active_masks: True
  huber_delta: 10.0
  action_aggregation: prod
  share_param: False
  fixed_order: False
  # ===================== ESCP-specific parameters =====================
  # dimensionality of the environment-probe embedding
  escp_ep_dim: 2
  # GRU hidden size of the environment probe
  escp_ep_hidden: 64
  # history-truncation window H (the RNN only sees the last H steps)
  escp_history_len: 16
  # bottleneck => stochastic embedding (deterministic at eval)
  escp_bottleneck: True
  # environment-probe (RMDM) optimizer learning rate
  escp_ep_lr: 0.0003
  # RMDM loss weights: variance-minimization (consistency) and DPP diversity
  escp_consistency_weight: 1.0
  escp_diversity_weight: 1.0
  # overall scale of the RMDM loss applied to the env probe
  escp_repre_loss_factor: 1.0
  # EMA coefficient for per-task mean embeddings
  escp_rmdm_tau: 0.995
  # RBF kernel sharpness for the relational matrix (tune per ep scale)
  escp_rbf_radius: 16.0
  # kernel for the determinant loss: "rbf" or "inner"
  escp_kernel_type: rbf
  # number of RMDM gradient steps per training iteration
  escp_num_rmdm_updates: 1
  escp_ep_max_grad_norm: 1.0
  # ---- pseudo-task discretization of the hidden context ----
  # env info key used as the (privileged) context; TCC Ant exposes info["ambient"]
  escp_task_key: ambient
  # number of discrete bins the context is split into (the pseudo-tasks)
  escp_num_task_bins: 8
  # range of the context value used for binning
  escp_task_min: 0.0
  escp_task_max: 1.0
  # whether to also condition the centralized critic on the env embeddings
  use_escp_critic: True
logger:
  log_dir: "./results"
