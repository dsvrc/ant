# Configuration file for TRIO (HAPPO + task-tracking variational inference).
seed:
  seed_specify: True
  seed: 1
device:
  cuda: True
  cuda_deterministic: True
  torch_threads: 4
train:
  n_rollout_threads: 20
  num_env_steps: 10000000
  episode_length: 200
  log_interval: 5
  eval_interval: 25
  use_valuenorm: True
  use_linear_lr_decay: False
  use_proper_time_limits: True
  model_dir: ~
eval:
  use_eval: True
  n_eval_rollout_threads: 10
  eval_episodes: 20
render:
  use_render: False
  render_episodes: 10
model:
  hidden_sizes: [128, 128]
  activation_func: relu
  use_feature_normalization: True
  initialization_method: orthogonal_
  gain: 0.01
  use_naive_recurrent_policy: False
  use_recurrent_policy: False
  recurrent_n: 1
  data_chunk_length: 10
  lr: 0.0005
  critic_lr: 0.0005
  opti_eps: 0.00001
  weight_decay: 0
  std_x_coef: 1
  std_y_coef: 0.5
algo:
  ppo_epoch: 5
  critic_epoch: 5
  use_clipped_value_loss: True
  clip_param: 0.2
  actor_num_mini_batch: 1
  critic_num_mini_batch: 1
  entropy_coef: 0.01
  value_loss_coef: 1
  use_max_grad_norm: True
  max_grad_norm: 10.0
  use_gae: True
  gamma: 0.99
  gae_lambda: 0.95
  use_huber_loss: True
  use_policy_active_masks: True
  huber_delta: 10.0
  action_aggregation: prod
  share_param: False
  fixed_order: False
  # ===================== TRIO-specific parameters =====================
  # dimensionality of the inferred task latent
  trio_latent_dim: 1
  # env info keys used as the (privileged, train-time) oracle task labels.
  # The TCC Ant exposes the hidden day/night phase as info["ambient"].
  trio_task_keys: ["ambient"]
  # GRU hidden size and head size of the variational inference network
  trio_vi_gru_hidden: 64
  trio_vi_hidden2: 16
  # VI optimizer learning rate
  trio_vae_lr: 0.001
  # fixed broad prior over the task latent (ambient lives in [0, 1])
  trio_prior_mu: 0.5
  trio_prior_var: 0.25
  # decay the KL-to-prior weight as the context grows (TRIO's "trust")
  trio_use_decay_kld: True
  trio_decay_kld_rate: 0.1
  # max context-window length for a VI update (null = full rollout)
  trio_vae_max_window: ~
  # number of VI gradient steps per training iteration
  trio_num_vi_updates: 1
  trio_vi_max_grad_norm: 1.0
  # whether to also condition the centralized critic on the task latents
  use_trio_critic: True
  # eval-time linear forecaster of the next latent (TRIO's GP analogue)
  trio_use_forecast: True
  trio_forecast_len: 10
logger:
  log_dir: "./results"
