# Configuration file for the COREP algorithm (HAPPO + Causal-Origin REPresentation).
seed:
  # whether to use the specified seed
  seed_specify: True
  # seed
  seed: 1
device:
  # whether to use CUDA
  cuda: True
  # whether to set CUDA deterministic
  cuda_deterministic: True
  # arg to torch.set_num_threads
  torch_threads: 4
train:
  # number of parallel environments for training data collection
  n_rollout_threads: 20
  # number of total training steps
  num_env_steps: 10000000
  # number of steps per environment per training data collection
  episode_length: 200
  # logging interval
  log_interval: 5
  # evaluation interval
  eval_interval: 25
  # whether to use ValueNorm
  use_valuenorm: True
  # whether to use linear learning rate decay
  use_linear_lr_decay: False
  # whether to consider the case of truncation when an episode is done
  use_proper_time_limits: True
  # if set, load models from this directory; otherwise, randomly initialise the models
  model_dir: ~
eval:
  # whether to use evaluation
  use_eval: True
  # number of parallel environments for evaluation
  n_eval_rollout_threads: 10
  # number of episodes per evaluation
  eval_episodes: 20
render:
  # whether to use render
  use_render: False
  # number of episodes to render
  render_episodes: 10
model:
  # network parameters
  # hidden sizes for mlp module in the network
  hidden_sizes: [128, 128]
  # activation function, choose from sigmoid, tanh, relu, leaky_relu, selu
  activation_func: relu
  # whether to use feature normalization
  use_feature_normalization: True
  # initialization method for network parameters, choose from xavier_uniform_, orthogonal_, ...
  initialization_method: orthogonal_
  # gain of the output layer of the network.
  gain: 0.01
  # recurrent parameters
  # whether to use rnn policy (data is not chunked for training)
  use_naive_recurrent_policy: False
  # whether to use rnn policy (data is chunked for training)
  use_recurrent_policy: False
  # number of recurrent layers
  recurrent_n: 1
  # length of data chunk; only useful when use_recurrent_policy is True; episode_length has to be a multiple of data_chunk_length
  data_chunk_length: 10
  # optimizer parameters
  # actor learning rate
  lr: 0.0005
  # critic learning rate
  critic_lr: 0.0005
  # eps in Adam
  opti_eps: 0.00001
  # weight_decay in Adam
  weight_decay: 0
  # parameters of diagonal Gaussian distribution
  std_x_coef: 1
  # parameters of diagonal Gaussian distribution
  std_y_coef: 0.5
algo:
  # ppo parameters
  # number of epochs for actor update
  ppo_epoch: 5
  # number of epochs for critic update
  critic_epoch: 5
  # whether to use clipped value loss
  use_clipped_value_loss: True
  # clip parameter
  clip_param: 0.2
  # number of mini-batches per epoch for actor update
  actor_num_mini_batch: 1
  # number of mini-batches per epoch for critic update
  critic_num_mini_batch: 1
  # coefficient for entropy term in actor loss
  entropy_coef: 0.01
  # coefficient for value loss
  value_loss_coef: 1
  # whether to clip gradient norm
  use_max_grad_norm: True
  # max gradient norm
  max_grad_norm: 10.0
  # whether to use Generalized Advantage Estimation (GAE)
  use_gae: True
  # discount factor
  gamma: 0.99
  # GAE lambda
  gae_lambda: 0.95
  # whether to use huber loss
  use_huber_loss: True
  # whether to use policy active masks
  use_policy_active_masks: True
  # huber delta
  huber_delta: 10.0
  # method of aggregating the probability of multi-dimensional actions, choose from prod, mean
  action_aggregation: prod
  # whether to share parameter among actors
  share_param: False
  # whether to use a fixed optimisation order
  fixed_order: False
  # ===================== COREP-specific parameters =====================
  # dimensionality of the causal-origin latent (mu/logvar each have this dim)
  corep_latent_dim: 8
  # number of graph nodes the state is projected to
  corep_num_nodes: 8
  # number of attention heads in the GAT layers
  corep_num_heads: 4
  # per-node feature dim after StateToGraph projection
  corep_node_feature_dim: 16
  # hidden dim of the first GAT layer
  corep_gat_hidden_dim: 32
  # output dim of the dual-GAT (causal-origin state embedding)
  corep_state_embed_dim: 16
  # action / reward embedding dims fed into the GRU belief encoder
  corep_action_embed_dim: 16
  corep_reward_embed_dim: 16
  # GRU belief hidden size
  corep_gru_hidden_size: 128
  # dropout inside the GAT attention
  corep_gat_dropout: 0.6
  # thresholds/temperature for the (gumbel) graph construction and (sigmoid) loss graph
  corep_graph_threshold: 0.8
  corep_graph_temperature: 0.8
  corep_similarity_threshold: 0.7
  # VAE optimizer learning rate
  lr_vae: 0.0005
  # ELBO / COREP loss coefficients
  corep_kl_weight: 0.1
  corep_rew_loss_coeff: 1.0
  corep_state_loss_coeff: 1.0
  corep_graph_loss_coeff: 0.1
  corep_sparsity_loss_coeff: 0.001
  corep_mag_loss_coeff: 0.001
  # which decoders to use for the ELBO
  corep_decode_reward: True
  corep_decode_state: True
  # KL against a fixed Gaussian prior (True) or the previous posterior (False, VariBAD-style)
  corep_kl_to_gauss_prior: False
  # number of VAE gradient steps per training iteration
  corep_num_vae_updates: 1
  # truncated-BPTT chunk size for the GRU in the VAE update (null = full sequence)
  corep_tbptt_stepsize: 50
  # max grad norm for the encoder during the VAE update
  corep_encoder_max_grad_norm: 1.0
  # hidden layers of the reward/state decoders
  corep_decoder_layers: [64, 32]
  # whether to also condition the centralized critic on the causal-origin latents
  use_corep_critic: True
  # ---- guided-updating (TD-error gated freeze of the stable GAT) ----
  td_buffer_size: 2000
  td_recent_size: 0.1
  confidence: 1.96
  freeze_eps: 0.05
logger:
  # logging directory
  log_dir: "./results"
