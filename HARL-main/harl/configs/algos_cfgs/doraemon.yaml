# Configuration file for DORAEMON (Domain Randomization via Entropy Maximization;
# Tiboni et al., 2023). The policy/critic are plain HAPPO; DORAEMON adds an
# environment-side domain-randomization curriculum (OnPolicyDoraemonRunner).
seed:
  seed_specify: True
  seed: 1
device:
  cuda: True
  cuda_deterministic: True
  torch_threads: 4
train:
  n_rollout_threads: 20
  num_env_steps: 10000000
  episode_length: 200
  log_interval: 5
  eval_interval: 25
  use_valuenorm: True
  use_linear_lr_decay: False
  use_proper_time_limits: True
  model_dir: ~
eval:
  use_eval: True
  n_eval_rollout_threads: 10
  eval_episodes: 20
render:
  use_render: False
  render_episodes: 10
model:
  hidden_sizes: [128, 128]
  activation_func: relu
  use_feature_normalization: True
  initialization_method: orthogonal_
  gain: 0.01
  use_naive_recurrent_policy: False
  use_recurrent_policy: False
  recurrent_n: 1
  data_chunk_length: 10
  lr: 0.0005
  critic_lr: 0.0005
  opti_eps: 0.00001
  weight_decay: 0
  std_x_coef: 1
  std_y_coef: 0.5
algo:
  ppo_epoch: 5
  critic_epoch: 5
  use_clipped_value_loss: True
  clip_param: 0.2
  actor_num_mini_batch: 1
  critic_num_mini_batch: 1
  entropy_coef: 0.01
  value_loss_coef: 1
  use_max_grad_norm: True
  max_grad_norm: 10.0
  use_gae: True
  gamma: 0.99
  gae_lambda: 0.95
  use_huber_loss: True
  use_policy_active_masks: True
  huber_delta: 10.0
  action_aggregation: prod
  share_param: False
  fixed_order: False
  # ===================== DORAEMON-specific parameters =====================
  # Dynamics-randomization dimensions. Each is a multiplicative factor (around the
  # nominal MuJoCo model value) bounded in [m, M]; param in
  # {mass, damping, friction, gravity, gain}. Optionally add "indices": [..] to
  # scale specific model elements only.
  doraemon_dr_spec:
    - {param: mass,     m: 0.5, M: 1.5}
    - {param: damping,  m: 0.5, M: 1.5}
    - {param: friction, m: 0.5, M: 1.5}
    - {param: gravity,  m: 0.8, M: 1.2}
    - {param: gain,     m: 0.5, M: 1.5}
  # initial Beta(a=b) value: large -> narrow distribution concentrated at the
  # center of each range (start close to nominal dynamics)
  doraemon_init_beta: 100.0
  # target Beta(a=b) value: 1.0 -> uniform (max-entropy) over the full range
  doraemon_target_beta: 1.0
  # KL trust-region bound epsilon (per-iteration distribution change); tune per env
  doraemon_kl_bound: 0.5
  # desired in-distribution success rate alpha
  doraemon_alpha: 0.5
  # episode return above which a trajectory counts as a success.
  # MUST be tuned to the Ant return scale (with train_until_lb the curriculum
  # will not expand until this success level is reached at the narrow init).
  doraemon_return_threshold: 1000.0
  # "success_rate" (constrain Prob[return >= thr]) or "return" (constrain E[return])
  doraemon_success_mode: success_rate
  # use the alpha_ci lower-confidence bound of the IS estimate as the constraint
  doraemon_robust_estimate: False
  doraemon_alpha_ci: 0.9
  # do not expand the distribution until the success constraint is first met
  doraemon_train_until_lb: True
  # number of HARL training episodes per DORAEMON distribution update
  doraemon_iter_episodes: 10
  # minimum number of completed episodes required to attempt an update
  doraemon_min_samples: 50
  # cap on the (dynamics, return) buffer kept per iteration
  doraemon_max_buffer: 2000
logger:
  log_dir: "./results"
