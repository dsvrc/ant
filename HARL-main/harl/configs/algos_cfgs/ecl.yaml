# Configuration for ECL with the HASAC backbone (full method).
#
# The ECL mechanism (identifier + localizer + anchor + envelope) is enabled by
# env_args.ecl=True and configured by env_args.ecl_cfg; the algo section here is
# identical to HASAC (the host is unchanged, spec P6). Run via the tuned config:
#   python examples/train.py --load_config \
#       tuned_configs/mamujoco/Ant-v2-4x2/ecl/config.json --exp_name ecl
seed:
  seed_specify: True
  seed: 1
device:
  cuda: True
  cuda_deterministic: True
  torch_threads: 4
train:
  n_rollout_threads: 20
  num_env_steps: 10000000
  warmup_steps: 10000
  train_interval: 50
  update_per_train: 1
  log_interval: ~
  eval_interval: 10000
  use_valuenorm: False
  use_linear_lr_decay: False
  use_proper_time_limits: True
  model_dir: ~
eval:
  use_eval: True
  n_eval_rollout_threads: 20
  eval_episodes: 40
render:
  use_render: False
  render_episodes: 10
model:
  hidden_sizes: [256, 256]
  activation_func: relu
  use_feature_normalization: True
  final_activation_func: tanh
  initialization_method: orthogonal_
  gain: 0.01
  lr: 0.0005
  critic_lr: 0.0005
algo:
  auto_alpha: False
  alpha: 0.2
  alpha_lr: 0.0003
  gamma: 0.99
  buffer_size: 1000000
  batch_size: 1000
  polyak: 0.005
  n_step: 5
  use_huber_loss: False
  use_policy_active_masks: True
  huber_delta: 10.0
  share_param: False
  fixed_order: False
logger:
  log_dir: "./results"
