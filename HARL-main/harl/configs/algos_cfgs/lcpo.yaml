# Configuration file for the LCPO algorithm (HAPPO + Locally Constrained Policy Optimization).
seed:
  seed_specify: True
  seed: 1
device:
  cuda: True
  cuda_deterministic: True
  torch_threads: 4
train:
  n_rollout_threads: 20
  num_env_steps: 10000000
  episode_length: 200
  log_interval: 5
  eval_interval: 25
  use_valuenorm: True
  use_linear_lr_decay: False
  use_proper_time_limits: True
  model_dir: ~
eval:
  use_eval: True
  n_eval_rollout_threads: 10
  eval_episodes: 20
render:
  use_render: False
  render_episodes: 10
model:
  hidden_sizes: [128, 128]
  activation_func: relu
  use_feature_normalization: True
  initialization_method: orthogonal_
  gain: 0.01
  use_naive_recurrent_policy: False
  use_recurrent_policy: False
  recurrent_n: 1
  data_chunk_length: 10
  lr: 0.0005
  critic_lr: 0.0005
  opti_eps: 0.00001
  weight_decay: 0
  std_x_coef: 1
  std_y_coef: 0.5
algo:
  ppo_epoch: 5
  critic_epoch: 5
  use_clipped_value_loss: True
  clip_param: 0.2
  actor_num_mini_batch: 1
  critic_num_mini_batch: 1
  entropy_coef: 0.01
  value_loss_coef: 1
  use_max_grad_norm: True
  max_grad_norm: 10.0
  use_gae: True
  gamma: 0.99
  gae_lambda: 0.95
  use_huber_loss: True
  use_policy_active_masks: True
  huber_delta: 10.0
  action_aggregation: prod
  share_param: False
  fixed_order: False
  # ===================== LCPO-specific parameters =====================
  # weight of the out-of-distribution KL anchoring penalty (LCPPO kappa).
  # Tuned via a {1,3,5,10} sweep on PCR-Ant: ood_kl falls monotonically with kappa
  # (0.0007 -> 0.0004 -> 0.00025 -> 0.00015) so the constraint bites harder, while the
  # effective penalty kappa*ood_kl SATURATES at ~0.0015 by kappa~10 (plateau = 5-10).
  # At matched phase+step (iters 1200-1300) kappa=10 raised the payload-dip TROUGH
  # (~1.15 -> ~1.32 step-reward) and the mean over k=1, at a slightly lower peak --
  # the intended anti-forgetting trade. 10 is the default; drop toward 5 if a full
  # 10M run shows the peak being suppressed. (Compare runs only at matched iter%200
  # phase -- single eval snapshots swing with the 200-iter payload cycle.)
  lcpo_kappa: 10.0
  # number of OOD anchor states sampled from the buffer each training iteration
  lcpo_ood_batch: 2048
  # number of OOD anchor states used per minibatch KL evaluation (<= lcpo_ood_batch)
  lcpo_ood_minibatch: 1024
  # OOD distance type: "l2" | "diag_mahala" | "mahala_full".
  # The Ant's non-stationary context (parasitic load / payload phase) is HIDDEN, so
  # we measure novelty over the full observation rather than a context slice.
  lcpo_ood_type: diag_mahala
  # OOD selection mode: "percentile" (recommended) | "absolute".
  #  * percentile: each iteration anchors the most-distant lcpo_ood_percentile %% of
  #    candidates. The anchored fraction is then STABLE across training -- needed here
  #    because the raw score distribution drifts a lot as the policy specializes
  #    per payload phase (observed frac_distant swung 25%%->62%% under a fixed thresh).
  #  * absolute: compare the raw score against lcpo_ood_thresh (fragile; kept for ref).
  lcpo_ood_thresh_mode: percentile
  # target distant fraction (%%) for percentile mode. 20 = anchor the clearest 20%% of
  # past-context states. Sweepable in {10, 20, 40}, but kappa matters more.
  lcpo_ood_percentile: 20
  # ABSOLUTE threshold, used only when lcpo_ood_thresh_mode=absolute. For
  # diag_mahala/mahala_full a state is OOD if ll = -d/2 < thresh (d = mean over obs
  # dims of z-score^2). In-dist sits near ll ~ -0.3..-0.5, so -2.0 flags ~nothing
  # (-> silent HAPPO); -0.6 flags ~25-60%% but drifts -> use percentile mode instead.
  lcpo_ood_thresh: -0.6
  # capacity of the all-time (reservoir-sampled) OOD FIFO. ~4000 obs are added per
  # iteration (episode_length*n_rollout_threads), so 100000 ~= 25 iters before the
  # reservoir starts subsampling all-history (which is what holds other-phase states).
  lcpo_ood_capacity: 100000
  # size of the recent-context window used to decide what is "distant". 20000 ~= 5
  # iters ~= 1000 env-steps ~= 2.5% of the PCR payload period (_P=40000), i.e. a
  # tight "current context" snapshot. Keep it << the NS period.
  lcpo_recent_window: 20000
logger:
  log_dir: "./results"
