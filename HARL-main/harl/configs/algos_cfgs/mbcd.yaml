# Configuration file for MBCD (Model-Based Context Detection; Alegre et al.,
# AAMAS 2021) on the HASAC off-policy backbone. The RL learner is HASAC; MBCD adds
# a per-context dynamics-model ensemble + CUSUM changepoint detection + a policy
# library (see OffPolicyMbcdRunner).
seed:
  seed_specify: True
  seed: 1
device:
  cuda: True
  cuda_deterministic: True
  torch_threads: 4
train:
  n_rollout_threads: 20
  num_env_steps: 10000000
  warmup_steps: 10000
  train_interval: 50
  update_per_train: 1
  log_interval: ~
  eval_interval: 10000
  use_valuenorm: False
  use_linear_lr_decay: False
  use_proper_time_limits: True
  model_dir: ~
eval:
  use_eval: True
  n_eval_rollout_threads: 20
  eval_episodes: 40
render:
  use_render: False
  render_episodes: 10
model:
  hidden_sizes: [256, 256]
  activation_func: relu
  use_feature_normalization: True
  final_activation_func: tanh
  initialization_method: orthogonal_
  gain: 0.01
  lr: 0.001
  critic_lr: 0.0003
algo:
  auto_alpha: False
  alpha: 0.2
  alpha_lr: 0.0003
  gamma: 0.99
  buffer_size: 1000000
  batch_size: 1000
  polyak: 0.005
  n_step: 5
  use_huber_loss: False
  use_policy_active_masks: True
  huber_delta: 10.0
  share_param: False
  fixed_order: False
  # ========================= MBCD-specific parameters =========================
  # CUSUM detection threshold h (paper: |log alpha|); higher => fewer/later
  #   detections. Tune to the TCC cycle period.
  mbcd_cusum_threshold: 100.0
  # only accumulate the CUSUM when the current model is confident
  #   (epistemic disagreement var_mean < max_std) ...
  mbcd_max_std: 0.5
  # ... and after this many steps in the current context (must be << the context
  #   period, else changes are never detectable -- tune to the TCC cycle).
  mbcd_min_steps: 1000
  # number of std-devs defining the "new model" null hypothesis
  mbcd_num_stds: 2.0
  # per-context dynamics dataset capacity
  mbcd_memory_capacity: 100000
  # probabilistic dynamics-model ensemble
  mbcd_num_networks: 5
  mbcd_num_elites: 2
  mbcd_dynamics_hidden: 200
  mbcd_dynamics_layers: 4
  mbcd_dynamics_lr: 0.001
  mbcd_model_batch: 256
  # clear the HASAC replay buffer on a detected change (the reference clears its
  #   MBPO model buffer). Off by default: with a real-experience buffer the ring
  #   buffer ages out stale data naturally and clearing would stall learning.
  mbcd_clear_buffer_on_change: False
logger:
  log_dir: "./results"
