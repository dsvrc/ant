# Configuration file for the WISDOM algorithm
# (HAPPO + Wavelet Predictive Representations for non-stationary RL;
#  arXiv:2510.04507).
seed:
  seed_specify: True
  seed: 1
device:
  cuda: True
  cuda_deterministic: True
  torch_threads: 4
train:
  n_rollout_threads: 20
  num_env_steps: 10000000
  episode_length: 200
  log_interval: 5
  eval_interval: 25
  use_valuenorm: True
  use_linear_lr_decay: False
  use_proper_time_limits: True
  model_dir: ~
eval:
  use_eval: True
  n_eval_rollout_threads: 10
  eval_episodes: 20
render:
  use_render: False
  render_episodes: 10
model:
  hidden_sizes: [128, 128]
  activation_func: relu
  use_feature_normalization: True
  initialization_method: orthogonal_
  gain: 0.01
  use_naive_recurrent_policy: False
  use_recurrent_policy: False
  recurrent_n: 1
  data_chunk_length: 10
  lr: 0.0005
  critic_lr: 0.0005
  opti_eps: 0.00001
  weight_decay: 0
  std_x_coef: 1
  std_y_coef: 0.5
algo:
  ppo_epoch: 5
  critic_epoch: 5
  use_clipped_value_loss: True
  clip_param: 0.2
  actor_num_mini_batch: 1
  critic_num_mini_batch: 1
  entropy_coef: 0.01
  value_loss_coef: 1
  use_max_grad_norm: True
  max_grad_norm: 10.0
  use_gae: True
  gamma: 0.99
  gae_lambda: 0.95
  use_huber_loss: True
  use_policy_active_masks: True
  huber_delta: 10.0
  action_aggregation: prod
  share_param: False
  fixed_order: False
  # ========================= WISDOM-specific parameters =========================
  # dimension of the task latent z (and of the wavelet representation pred_z)
  wisdom_latent_dim: 5
  # learning rate for the encoder and the wavelet z_model
  wisdom_lr_encoder: 0.0003
  # weight of the wavelet TD loss within z_loss = pred_loss + coef * td_loss
  wisdom_td_loss_coefficient: 0.1
  # weight of the encoder KL-to-prior loss
  wisdom_kl_weight: 0.1
  # wavelet network: channels (keep 1; the latent is a single-channel signal),
  #   filter size, number of decomposition levels, dropout
  wisdom_wavelet_dimension: 1
  wisdom_wavelet_filter_size: 2
  wisdom_wavelet_depth: 2
  wisdom_wavelet_dropout: 0.2
  # discount of the wavelet TD operator and target-network soft-update rate
  wisdom_gamma_z: 0.99
  wisdom_soft_target_tau: 0.005
  # number of representation updates per HAPPO update
  wisdom_num_repr_updates: 1
  # gradient-norm clip for the encoder
  wisdom_encoder_max_grad_norm: 10.0
  # encoder MLP hidden sizes
  wisdom_encoder_hidden: [200, 200, 200]
  # condition the centralized critic on all agents' wavelet representations
  use_wisdom_critic: True
logger:
  log_dir: "./results"
