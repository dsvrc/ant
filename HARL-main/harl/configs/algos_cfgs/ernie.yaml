# Configuration file for the ERNIE algorithm
# (HAPPO + adversarial regularization for robust, Lipschitz-continuous policies;
#  Bukharin et al., NeurIPS 2023, arXiv:2310.10810).
seed:
  seed_specify: True
  seed: 1
device:
  cuda: True
  cuda_deterministic: True
  torch_threads: 4
train:
  n_rollout_threads: 20
  num_env_steps: 10000000
  episode_length: 200
  log_interval: 5
  eval_interval: 25
  use_valuenorm: True
  use_linear_lr_decay: False
  use_proper_time_limits: True
  model_dir: ~
eval:
  use_eval: True
  n_eval_rollout_threads: 10
  eval_episodes: 20
render:
  use_render: False
  render_episodes: 10
model:
  hidden_sizes: [128, 128]
  activation_func: relu
  use_feature_normalization: True
  initialization_method: orthogonal_
  gain: 0.01
  use_naive_recurrent_policy: False
  use_recurrent_policy: False
  recurrent_n: 1
  data_chunk_length: 10
  lr: 0.0005
  critic_lr: 0.0005
  opti_eps: 0.00001
  weight_decay: 0
  std_x_coef: 1
  std_y_coef: 0.5
algo:
  ppo_epoch: 5
  critic_epoch: 5
  use_clipped_value_loss: True
  clip_param: 0.2
  actor_num_mini_batch: 1
  critic_num_mini_batch: 1
  entropy_coef: 0.01
  value_loss_coef: 1
  use_max_grad_norm: True
  max_grad_norm: 10.0
  use_gae: True
  gamma: 0.99
  gae_lambda: 0.95
  use_huber_loss: True
  use_policy_active_masks: True
  huber_delta: 10.0
  action_aggregation: prod
  share_param: False
  fixed_order: False
  # ===================== ERNIE-specific parameters =====================
  # lambda: weight of the adversarial regularizer added to each actor's loss
  #   (paper sweeps {1e-4, 1e-3, 1e-2, 1e-1}). Set 0 to recover plain HAPPO.
  ernie_lambda: 0.05
  # K: number of PGD attack steps approximating the worst-case perturbation
  #   (the released ERNIE configs use 1; the paper shows robustness to K).
  ernie_perturb_steps: 1
  # alpha: PGD step size for the inner maximization
  ernie_perturb_alpha: 0.05
  # epsilon: radius of the perturbation ball (l_inf). <= 0 disables projection.
  ernie_epsilon: 0.1
  # if True, perturbation magnitudes scale with |obs| (the released code's
  #   ``* torch.abs(obs)`` relative scaling); if False they are absolute.
  ernie_relative: True
  # ascent-direction normalization for the attack: "l2" | "sign" | "raw".
  #   "raw" reproduces the exact released-code (un-normalized gradient) step.
  ernie_perturb_norm: l2
  # std of the small Gaussian noise used to initialize the perturbation
  ernie_init_std: 0.001
  # Stackelberg variant: differentiate through the PGD attack so the policy
  #   (leader) anticipates the perturbation (follower) reaction. False = the
  #   stable "simplest version"; True = the paper's Stackelberg formulation.
  ernie_stackelberg: False
logger:
  log_dir: "./results"
