map_name: 3s_vs_5z        # three Stalkers must KITE five Zealots: movement decides
                          # the battle, and MAPPO is known to solve it
state_type: FP            # choose from FP (Feature Pruned) and EP (Environment Provided)

# ===========================================================================
# SMAC-LANE -- LANE SWERVE UNDER DRIFT.  CELL: (C, invertible) -- compensation.
# ---------------------------------------------------------------------------
# TASK PHYSICS, NOT A METHOD KNOB (NS-3.1).  Every algorithm runs inside it.
#
#   medium    my lane: the cone within 135 deg of my ORDERED move direction,
#             proximity-weighted, teammates only (j != i)
#   driver    how cramped the ground is; EXACTLY zero over half of every cycle
#   harm      the move order's world point is rotated away from the traffic by
#             d = sigma*L*A(t) * send . Q / load_norm.  Attacks, stops, the reward,
#             the observation are stock.
#   inverse   the compensator pre-rotates by the estimated swerve.  A rotation has
#             an exact inverse, so a correct estimate CANCELS the disturbance.
#
# A unit with no teammate in its lane never swerves, at any severity.
# The steering-only designs (smac_ns overkill, smac_sa surface area) are kept as
# documented negative results: steering over targets could not recover a
# coupling harm offline, because every unit read the same cost.
# ===========================================================================
ns_on: 1                  # 0 = plain stock SMAC (B0, the controller calibrate.py needs)
ns_severity: 1.0          # sigma = 1: L rad of swerve per move at the reference squad
                          # (a STATED CALIBRATION, driver.py).  Choose the operating
                          # point with calibrate.py; sigma > 1 is beyond-physical.
ns_period: 25000          # env steps per cycle = 100 episode limits of 3s_vs_5z
ns_guard_frac: 0.5        # the other half is the PLACEBO: no swerve, at any sigma
ns_loss: 0.25             # L: radians of swerve per move at sigma = 1 (reference)
ns_mean_preserving: 0
ns_kernel_lambda: 2.0     # proximity scale of the lane, world units (~3 Stalker widths)
ns_rho: 0.5               # memory of the public lane channels
ns_send: "1.4,0.6"        # a teammate AHEAD costs more swerve than one on the FLANK
ns_spacing: 1.5           # the declared reference squad: a line at this spacing
ns_corr_clip: 1.5707963   # relief valve: never pre-rotate more than a quarter turn

# --- the estimator (URB's core, verbatim) ---------------------------------------
ns_mu: 0.99               # ~100-row memory: tracks the cycle, averages the noise
ns_p0: 10.0

# --- the arms (P-9.1).  Set by the runner's arm, not edited here. -----------
ns_pact: 0                # 1 = the compensator runs inside the layer
ns_g_fixed: 0.9           # its trust (P-5.1's prior); pactoff sets 0
ns_oracle: 0              # compensate with the TRUE swerve = the ceiling arm
ns_intercept_only: 0      # delete the peer channels = the (B)/(C) probe
